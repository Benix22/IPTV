name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [android-tv, main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Nombrar el APK
        run: cp android/app/build/outputs/apk/release/app-release.apk parrilla-tv.apk

      - uses: actions/upload-artifact@v4
        with:
          name: parrilla-tv-apk
          path: parrilla-tv.apk

      - name: Publicar release fija (tv-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete tv-latest --cleanup-tag --yes || true
          gh release create tv-latest parrilla-tv.apk \
            --target "$GITHUB_SHA" --latest \
            --title "Parrilla TV (última versión)" \
            --notes "APK para Fire Stick y Android TV, compilado desde ${GITHUB_SHA::7}. Instálalo con la app Downloader o con adb install."
